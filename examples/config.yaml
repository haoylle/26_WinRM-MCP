# Copy this file to config.yaml and edit it.
# Set WINRM_MCP_CONFIG to the full path of your config.yaml.

guest:
  host: "192.168.122.50"
  username: "Administrator"
  # Prefer WINRM_PASSWORD env var. password here is supported but not recommended.
  password: null
  transport: "ntlm"       # ntlm, kerberos, credssp, basic, certificate
  scheme: "http"          # use https for non-lab networks
  port: 5985               # 5986 for https
  server_cert_validation: "ignore" # validate|ignore; used for https
  operation_timeout_sec: 60
  read_timeout_sec: 90
  allow_unencrypted: true  # lab-only. Use https in real environments.
  path: "/wsman"

limits:
  max_stdout_chars: 200000
  # Legacy compatibility field. The simplified backend uses Copy-Item/Invoke-Command
  # instead of manual chunked transfers, so this value is no longer used.
  copy_chunk_bytes: 2048
  command_timeout_sec: 300

recovery:
  reconnect_timeout_sec: 300
  reconnect_interval_sec: 5
  reconnect_settle_sec: 10
  reboot_offline_timeout_sec: 60

analysis:
  sysinternals_dir: "C:\\Users\\Administrator\\Desktop\\SysinternalsSuite"
  litecov_path: "C:\\Users\\Administrator\\Desktop\\covcheck\\litecov.exe"
  coverage_file: "C:\\Users\\Administrator\\Desktop\\covcheck\\sym_cov.txt"
  build_files_dir: "C:\\Users\\Administrator\\Desktop\\build_files"

security:
  # Empty allowlist means allow all commands. For shared environments, add prefixes.
  allowed_command_prefixes: []
  denied_patterns:
    - "format c:"
    - "cipher /w"

kdnet:
  host_ip: "192.168.122.1"
  port: 50000
  key: "1.2.3.4"
  state_file: "C:\\mcp-state\\kd-session.json"
  bcdedit_path: "bcdedit.exe"
