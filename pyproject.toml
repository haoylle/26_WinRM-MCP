[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "winrm-mcp"
version = "1.0.0"
description = "Production-oriented MCP server for automating Windows guest VMs over WinRM"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "winrm-mcp contributors"}]
dependencies = [
  "mcp>=1.2.0",
  "pywinrm>=0.5.0",
  "PyYAML>=6.0.1",
  "pydantic>=2.7.0"
]

[project.scripts]
winrm-mcp = "winrm_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]
